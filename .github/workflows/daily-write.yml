name: Daily Novel Generation

on:
  workflow_dispatch:      # 仅手动触发（全书已完结，取消定时自动生成）

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许推送代码

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check if novel is complete
        id: check
        run: |
          CHAPTER_COUNT=$(ls chapters/chapter-*.md 2>/dev/null | wc -l)
          if [ "$CHAPTER_COUNT" -ge 115 ]; then
            echo "completed=true" >> $GITHUB_OUTPUT
            echo "小说已完结（${CHAPTER_COUNT}/115章），跳过生成。"
          else
            echo "completed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate chapters
        if: steps.check.outputs.completed != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODEL: deepseek-chat
          EDITOR_MODEL: deepseek-chat
        run: python3 scripts/generate_chapter.py --chapters 8 --no-deploy

      - name: Commit and push
        run: |
          git config user.name "Novel Bot"
          git config user.email "bot@novel.local"
          git add chapters/ docs/ story-bible/
          git diff --staged --quiet || git commit -m "每日自动更新 — $(date +'%Y-%m-%d')"
          git push
