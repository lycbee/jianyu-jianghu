<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <link rel="alternate" type="application/rss+xml" href="{{ .Site.BaseURL }}index.xml" title="{{ .Site.Title }}">
    <style>
        :root {
            --bg: #faf9f7;
            --text: #2c2c2c;
            --link: #8b4513;
            --border: #e0d8cf;
        }
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }
        h1 { font-size: 2rem; }
        .intro { margin: 2rem 0; font-size: 1.1rem; }
        .latest {
            list-style: none; padding: 0;
            border-left: 3px solid var(--border);
            padding-left: 1.5rem;
        }
        .latest li { margin: 0.5rem 0; }
        .latest a { color: var(--link); text-decoration: none; }
        .latest a:hover { text-decoration: underline; }
        .cta { margin: 2rem 0; }
        .cta a {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: var(--link);
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>{{ .Site.Title }}</h1>
    <div class="intro">
        <p>{{ .Site.Params.description }}</p>
    </div>

    <h2>最新章节</h2>
    {{ $chapters := where .Site.RegularPages "Section" "chapters" }}
    {{ $latest := first 10 $chapters.ByWeight.Reverse }}
    <ul class="latest">
        {{ range $latest }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> — {{ .Date.Format "2006-01-02" }}</li>
        {{ end }}
    </ul>

    <div class="cta">
        <a href="/chapters/">浏览全部目录</a>
        <a href="{{ .Site.BaseURL }}index.xml" style="background:none;color:var(--link);">RSS 订阅</a>
    </div>
</body>
</html>
