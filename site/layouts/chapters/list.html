<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — {{ .Site.Title }}</title>
    <link rel="alternate" type="application/rss+xml" href="{{ .Site.BaseURL }}index.xml" title="{{ .Site.Title }}">
    <style>
        :root {
            --bg: #faf9f7;
            --text: #2c2c2c;
            --link: #8b4513;
            --border: #e0d8cf;
            --accent: #f5f0e8;
        }
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }
        h1 { font-size: 1.8rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
        .chapter-list { list-style: none; padding: 0; }
        .chapter-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        .chapter-list a {
            color: var(--link);
            text-decoration: none;
            font-size: 1.1rem;
        }
        .chapter-list a:hover { text-decoration: underline; }
        .chapter-date { color: #999; font-size: 0.85rem; margin-left: 1rem; }
        nav { margin: 2rem 0; }
        nav a { color: var(--link); }
    </style>
</head>
<body>
    <nav><a href="/">← 首页</a></nav>
    <h1>{{ .Title }}</h1>
    <ul class="chapter-list">
        {{ range .Pages.ByWeight }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <span class="chapter-date">{{ .Date.Format "2006-01-02" }}</span>
        </li>
        {{ end }}
    </ul>
    <p><a href="{{ .Site.BaseURL }}index.xml">RSS 订阅</a></p>
</body>
</html>
