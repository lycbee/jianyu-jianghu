<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — {{ .Site.Title }}</title>
    <link rel="alternate" type="application/rss+xml" href="{{ .Site.BaseURL }}index.xml" title="{{ .Site.Title }}">
    <style>
        :root {
            --bg: #faf9f7;
            --text: #2c2c2c;
            --link: #8b4513;
            --border: #e0d8cf;
        }
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.9;
            font-size: 1.05rem;
        }
        article { margin: 2rem 0; }
        article p { text-indent: 2em; margin: 0.5em 0; }
        article h2 { font-size: 1.5rem; margin-top: 2rem; text-indent: 0; }
        nav { margin: 2rem 0; }
        nav a { color: var(--link); text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .chapter-nav {
            display: flex; justify-content: space-between;
            margin: 2rem 0; padding: 1rem 0; border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <nav><a href="/">← 首页</a> | <a href="/chapters/">目录</a></nav>
    <article>
        {{ .Content }}
    </article>
    <div class="chapter-nav">
        {{ with .NextInSection }}<a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
        {{ with .PrevInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
    </div>
</body>
</html>
